<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cámara Dual</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f5f7;--fg:#111;--card:#fff;--ac:#d9480f;--mu:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f2f2f2;--card:#1d1d1f;--mu:#999}}
:root[data-theme="dark"]{--bg:#111;--fg:#f2f2f2;--card:#1d1d1f;--mu:#999}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.box{height:62vh;aspect-ratio:9/16;max-width:100%;margin:8px auto;border-radius:10px;background:#000;display:block;object-fit:cover}
#cv{touch-action:none}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:600;background:var(--ac);color:#fff;margin-top:8px}
button.sec{background:var(--bg);color:var(--fg);border:1px solid var(--mu)}
button:disabled{opacity:.5}
select{width:100%;padding:10px;border-radius:10px;font-size:16px;margin-top:6px}
p{color:var(--mu);font-size:14px;margin:6px 0}
.step{font-weight:700}
</style>
</head>
<body>
<h1>📷 Cámara Dual</h1>

<div class="card">
<div class="step" id="stepTxt">Toma 1: cámara trasera (solo video, será el fondo)</div>
<video id="live" class="box" playsinline muted autoplay></video>
<canvas id="cv" class="box" style="display:none"></canvas>
<div id="layWrap" style="display:none">
<p>Diseño de la toma 2 (puedes cambiarlo mientras grabas):</p>
<select id="lay">
<option value="pip">Frontal en recuadro (se mueve y cambia de tamaño)</option>
<option value="top">Frontal arriba y trasera abajo</option>
<option value="bottom">Frontal abajo y trasera arriba</option>
</select>
</div>
<button id="recBtn">● Iniciar grabación</button>
<p id="status"></p>
</div>

<div class="card" id="outCard" style="display:none">
<div class="step">Video final (9:16)</div>
<video id="out" class="box" playsinline controls></video>
<button id="shareBtn">Guardar en Fototeca</button>
<p>En el menú elige "Guardar video". Si no abre, mantén presionado el video.</p>
</div>

<button class="sec" id="resetBtn">Empezar de nuevo</button>

<script>
const $=id=>document.getElementById(id);
const W=720,H=1280;
let stream=null,rec=null,take=1,blob1=null,bg=null,loopOn=false,outBlob=null,outExt="mp4";
const inset={x:W-300-24,y:60,w:300,h:Math.round(300*16/9)};
const mime=()=>{for(const m of ["video/mp4","video/webm;codecs=vp8,opus","video/webm"]){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m}return ""};
function cover(ctx,v,x,y,w,h){
  if(!v||!v.videoWidth)return;
  const r=Math.max(w/v.videoWidth,h/v.videoHeight),sw=w/r,sh=h/r;
  ctx.drawImage(v,(v.videoWidth-sw)/2,(v.videoHeight-sh)/2,sw,sh,x,y,w,h);
}
async function openCam(facing,audio){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1080},height:{ideal:1920}},audio:audio});
  $("live").srcObject=stream;
  await $("live").play().catch(()=>{});
}
async function start(){
  try{
    $("status").textContent="Abriendo cámara...";
    if(take===1)await openCam("environment",false);
    else{await openCam("user",true);await prepareCompose();}
    $("status").textContent=take===1?"Listo.":"Arrastra el recuadro con el dedo; pellizca para cambiar su tamaño.";
  }catch(e){
    $("status").textContent="No se pudo abrir la cámara. Revisa permisos o abre el enlace directo en Safari.";
  }
}
async function prepareCompose(){
  bg=document.createElement("video");
  bg.src=URL.createObjectURL(blob1);bg.playsInline=true;bg.muted=true;
  await new Promise(r=>{bg.onloadeddata=r;bg.load()});
  bg.currentTime=0.05;
  const live=$("live");
  live.className="";live.style.cssText="position:fixed;left:0;top:0;width:4px;height:4px;opacity:0.02;pointer-events:none";
  const cv=$("cv");cv.width=W;cv.height=H;cv.style.display="block";
  $("layWrap").style.display="block";
  const ctx=cv.getContext("2d");loopOn=true;
  (function draw(){
    ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
    if(live.paused)live.play().catch(()=>{});
    const lay=$("lay").value;
    if(lay==="pip"){
      cover(ctx,bg,0,0,W,H);
      cover(ctx,live,inset.x,inset.y,inset.w,inset.h);
      ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.strokeRect(inset.x,inset.y,inset.w,inset.h);
    }else if(lay==="top"){
      cover(ctx,live,0,0,W,H/2);cover(ctx,bg,0,H/2,W,H/2);
    }else{
      cover(ctx,bg,0,0,W,H/2);cover(ctx,live,0,H/2,W,H/2);
    }
    if(loopOn)requestAnimationFrame(draw);
  })();
}
(function(){
  const cv=$("cv"),pts=new Map();let pd=0;
  const toC=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
  const inside=p=>$("lay").value==="pip"&&p.x>=inset.x&&p.x<=inset.x+inset.w&&p.y>=inset.y&&p.y<=inset.y+inset.h;
  const dist=()=>{const a=[...pts.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
  const clamp=()=>{
    inset.w=Math.max(160,Math.min(W,inset.w));inset.h=Math.round(inset.w*16/9);
    inset.x=Math.max(0,Math.min(W-inset.w,inset.x));inset.y=Math.max(0,Math.min(H-inset.h,inset.y));
  };
  cv.addEventListener("pointerdown",e=>{
    const p=toC(e);
    if(inside(p)||pts.size>0){pts.set(e.pointerId,p);cv.setPointerCapture(e.pointerId);pd=dist();}
  });
  cv.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    const p=toC(e),o=pts.get(e.pointerId);
    pts.set(e.pointerId,p);
    if(pts.size===1){inset.x+=p.x-o.x;inset.y+=p.y-o.y;}
    else{
      const d=dist();
      if(pd>0){const cx=inset.x+inset.w/2,cy=inset.y+inset.h/2;inset.w*=d/pd;inset.h=inset.w*16/9;inset.x=cx-inset.w/2;inset.y=cy-inset.h/2;}
      pd=d;
    }
    clamp();
  });
  const up=e=>{pts.delete(e.pointerId);pd=dist();};
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
})();
$("recBtn").onclick=()=>{
  if(rec&&rec.state==="recording"){rec.stop();return}
  if(!stream){start();return}
  const m=mime(),parts=[];
  if(take===1){
    rec=new MediaRecorder(stream,m?{mimeType:m}:undefined);
    rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
    rec.onstop=()=>{
      blob1=new Blob(parts,{type:rec.mimeType||"video/mp4"});
      take=2;
      $("stepTxt").textContent="Toma 2: cámara frontal (video y audio)";
      $("recBtn").textContent="● Iniciar grabación";
      start();
    };
    rec.start();
    $("recBtn").textContent="■ Detener";
    $("status").textContent="Grabando toma 1...";
  }else{
    const cs=$("cv").captureStream(30);
    stream.getAudioTracks().forEach(t=>cs.addTrack(t));
    rec=new MediaRecorder(cs,m?{mimeType:m}:undefined);
    rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
    rec.onstop=()=>{
      loopOn=false;bg.pause();
      stream.getTracks().forEach(t=>t.stop());stream=null;
      outBlob=new Blob(parts,{type:rec.mimeType||"video/mp4"});
      outExt=(rec.mimeType||"").includes("webm")?"webm":"mp4";
      $("out").src=URL.createObjectURL(outBlob);
      $("outCard").style.display="block";
      $("cv").style.display="none";$("layWrap").style.display="none";
      $("recBtn").disabled=true;$("recBtn").textContent="Grabación terminada";
      $("stepTxt").textContent="Listo: tu video final";
      $("status").textContent="";
    };
    rec.start();
    bg.currentTime=0;bg.play().catch(()=>{});
    $("recBtn").textContent="■ Detener";
    $("status").textContent="Grabando... mueve el recuadro con el dedo.";
  }
};
$("shareBtn").onclick=async()=>{
  if(!outBlob)return;
  const f=new File([outBlob],"video-dual."+outExt,{type:outBlob.type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
    else $("status").textContent="Mantén presionado el video final para guardarlo.";
  }catch(e){}
};
$("resetBtn").onclick=()=>location.reload();
start();
</script>
</body>
</html>
